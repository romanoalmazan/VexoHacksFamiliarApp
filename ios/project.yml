name: Familiar
options:
  bundleIdPrefix: com.rovalapps
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  VexoBand:
    path: VexoBand
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  Familiar:
    type: application
    platform: iOS
    sources:
      - Familiar
    dependencies:
      - package: VexoBand
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    info:
      path: Familiar/Info.plist
      properties:
        CFBundleDisplayName: Familiar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Familiar connects to your Vexo band and your Meta glasses over Bluetooth.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory]
        # Meta glasses (Wearables Device Access Toolkit). Developer Mode needs no Meta app ID.
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBonjourServices: [_bonjour._tcp]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.rovalapps.familiar
            CFBundleURLSchemes: [familiar]
        MWDAT:
          AppLinkURLScheme: familiar://
          MetaAppID: "0"
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
        NSLocalNetworkUsageDescription: Familiar sends the band's sound and camera pictures to your team's server on this Wi-Fi.
        NSCameraUsageDescription: Familiar uses the camera to recognise the people you have added and tell you who they are.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rovalapps.familiar
        DEVELOPMENT_TEAM: WPBZD3BH2S
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
